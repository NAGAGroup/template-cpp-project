name: CI

on:
  push:
    branches: [main]
  pull_request:

# The entire CI is pixi-first: every job provisions its toolchain and
# tasks through pixi environments — no system compilers, no setup-cpp,
# no vcpkg/Conan. One workspace at the repo root owns everything.
#
# We deliberately use pixi's DEFAULT resolution semantics (no --locked /
# --frozen): virtual packages (__archspec, __glibc, __cuda) legitimately
# differ across hosts and virtualized runners, and the committed
# pixi.lock still drives resolution wherever it is satisfiable.
# locked/frozen are developer-side tools for already-installed envs.
jobs:
  consume:
    name: consume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: app
      - name: Build the app chain (incl. both wrappers) and run the demo
        run: pixi run demo
      - name: Adaptive default env (library consumers)
        run: pixi install

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            envs: test test-static test-asan test-tsan
          - os: windows-latest
            envs: test test-static
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: ${{ matrix.envs }}
      - name: Run every test env for this platform
        run: pixi run test-all

  test-lowest:
    name: min-version compatibility (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: test-lowest
      - name: Tests against lowest direct dependency versions
        run: pixi run -e test-lowest test

  coverage:
    name: coverage (linux, llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: test-coverage
      - name: Instrumented tests + report
        run: pixi run -e test-coverage coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.info

  variants:
    # Selector envs: microarch subpackages (v4 skipped — runners lack
    # AVX-512, __archspec would refuse), the clang custom-platform
    # compiler axis, and the spdlog build-variant matrix.
    name: variants (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: v1 v3 clang spdlog14
      - name: Publish-set validation (dependency-ordered, self-contained)
        run: pixi publish --dry-run --to ./local-channel

  publish:
    # Real publishing with OIDC trusted publishing: the channel trusts this
    # repo + workflow, so no API key is stored anywhere. See docs/publishing.md
    # for the channel-side setup and the local/API-key alternative.
    # Only libraries are published — the demo app is not in the publish set.
    name: publish (linux)
    needs: [consume, test, style]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC; nothing else needs write
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # No env to install (publish builds its own), so no cache either:
          # setup-pixi rejects cache + run-install: false.
          cache: false
          run-install: false
      # --generate-attestation adds sigstore build provenance (prefix.dev):
      # consumers can verify who built the package and from which workflow.
      - name: Build and publish the library packages
        run: pixi publish --to https://prefix.dev/jackm97/naga-labs --generate-attestation

  style:
    name: style + docs + lint (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: style dev-enginelib
      - name: clang-format check
        run: pixi run -e style format-check
      - name: Doxygen
        run: pixi run -e style docs
      - name: clang-tidy (enginelib)
        run: pixi run -e dev-enginelib lint

  pack:
    # The non-pixi consumption path. NOTE: pixi-pack publishes source
    # packages per-package (--path semantics), which forbids source
    # run-deps — so packing envs with cross-package chains awaits an
    # upstream fix (workspace `pixi publish` handles the same set fine;
    # see the publish-local task). mathkit demonstrates the pack flow.
    name: pixi-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: header-only
      - name: Pack the header-only library environment
        run: pixi exec pixi-pack --create-executable --environment header-only --platform ${{ runner.os == 'Windows' && 'win-64' || 'linux-64' }} pixi.toml
      - uses: actions/upload-artifact@v4
        with:
          name: packed-env-${{ matrix.os }}
          path: |
            environment.sh
            environment.ps1
          if-no-files-found: warn
