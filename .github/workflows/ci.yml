name: CI

on:
  push:
    branches: [main]
  pull_request:

# The entire CI is pixi-first: every job provisions its toolchain and
# tasks through pixi environments — no system compilers, no setup-cpp,
# no vcpkg/Conan. Jobs cd into member workspaces because envs live with
# the workspace that owns them.
jobs:
  consume:
    name: consume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
      - name: Build every member package and run the demo
        run: pixi run demo

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
          manifest-path: packages/mathkit/pixi.toml
      - name: mathkit tests
        working-directory: packages/mathkit
        run: pixi run -e test test
      - name: enginelib tests (default variant)
        working-directory: packages/enginelib
        run: pixi run -e test test
      - name: enginelib tests (static variant)
        working-directory: packages/enginelib
        run: pixi run -e test-static test

  sanitize:
    name: sanitize (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
          manifest-path: packages/enginelib/pixi.toml
          # pixi's --locked verification is cwd-sensitive for workspaces
          # with variant-expanded dev closures (upstream bug): it fails via
          # --manifest-path from outside but passes in-directory — so we
          # run the locked install ourselves.
          run-install: false
      - name: Locked install (in-directory)
        working-directory: packages/enginelib
        run: pixi install --locked
      - name: ASan + UBSan
        working-directory: packages/enginelib
        run: pixi run -e test-asan test
      - name: TSan
        working-directory: packages/enginelib
        run: pixi run -e test-tsan test

  coverage:
    name: coverage (linux, llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
          manifest-path: packages/enginelib/pixi.toml
          # pixi's --locked verification is cwd-sensitive for workspaces
          # with variant-expanded dev closures (upstream bug): it fails via
          # --manifest-path from outside but passes in-directory — so we
          # run the locked install ourselves.
          run-install: false
      - name: Locked install (in-directory)
        working-directory: packages/enginelib
        run: pixi install --locked
      - name: Instrumented tests + report
        working-directory: packages/enginelib
        run: pixi run -e test-coverage coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: packages/enginelib/coverage.info

  variants:
    name: build-variants (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
          manifest-path: packages/enginelib/pixi.toml
          # pixi's --locked verification is cwd-sensitive for workspaces
          # with variant-expanded dev closures (upstream bug): it fails via
          # --manifest-path from outside but passes in-directory — so we
          # run the locked install ourselves.
          run-install: false
      - name: Locked install (in-directory)
        working-directory: packages/enginelib
        run: pixi install --locked
      - name: microarch v1 + v3 (v4 skipped — runners lack AVX-512, __archspec would refuse)
        working-directory: packages/enginelib
        run: pixi install -e v1 && pixi install -e v3
      - name: spdlog 1.14 matrix env
        working-directory: packages/enginelib
        run: pixi install -e spdlog14

  style:
    name: style + docs + lint (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
      - name: clang-format check
        run: pixi run -e style format-check
      - name: Doxygen
        run: pixi run -e style docs
      - name: clang-tidy (enginelib)
        working-directory: packages/enginelib
        run: pixi run -e dev lint

  pack:
    # The non-pixi consumption path. NOTE: pixi-pack (via pixi publish)
    # requires a self-contained publish set, and the publish walker skips
    # nested workspaces — so packs currently work for LEAF packages only
    # (no cross-member source run-deps). mathkit demonstrates the flow;
    # see docs/consuming.md for the upstream limitation affecting
    # app-level packs.
    name: pixi-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
          manifest-path: packages/mathkit/pixi.toml
      - name: Pack mathkit's consumer environment
        working-directory: packages/mathkit
        run: pixi exec pixi-pack --create-executable --environment default --platform ${{ runner.os == 'Windows' && 'win-64' || 'linux-64' }} pixi.toml
      - uses: actions/upload-artifact@v4
        with:
          name: packed-env-${{ matrix.os }}
          path: |
            packages/mathkit/environment.sh
            packages/mathkit/environment.ps1
          if-no-files-found: warn
