name: CI

on:
  push:
    branches: [main]
  pull_request:

# The entire CI is pixi-first: every job provisions its toolchain and
# tasks through pixi environments — no system compilers, no setup-cpp,
# no vcpkg/Conan. One workspace at the repo root owns everything.
#
# We deliberately use pixi's DEFAULT resolution semantics (no --locked /
# --frozen): virtual packages (__archspec, __glibc, __cuda) legitimately
# differ across hosts and virtualized runners, and the committed
# pixi.lock still drives resolution wherever it is satisfiable.
# locked/frozen are developer-side tools for already-installed envs.
jobs:
  consume:
    name: consume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: demo
      - name: Build the app chain (incl. both wrappers) and run the demo
        # -e is REQUIRED here: `demo` exists in every demo-* env, so a
        # bare `pixi run demo` is ambiguous (the §6 resolution lesson).
        run: pixi run -e demo demo
      - name: Library-consumer env (prod = the v1 tier)
        run: pixi install -e prod

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            envs: test test-clang test-asan test-tsan
          - os: windows-latest
            # Windows mirrors every cross-platform test env and adds the
            # win-only gnu (mingw) env; sanitizers stay linux-only (C-10).
            envs: test test-clang test-gnu-windows
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: ${{ matrix.envs }}
      - name: Run every test env for this platform
        run: pixi run test-all

  test-lowest:
    name: min-version compatibility (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: test-lowest
      - name: Tests against lowest direct dependency versions
        run: pixi run -e test-lowest test

  coverage:
    name: coverage (linux, llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: test-coverage
      - name: Instrumented tests + report
        run: pixi run -e test-coverage coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.info

  variants:
    # Variant surface, BOTH platforms: every cross-platform consumer env
    # mirrors onto Windows (prod, static, reldbg, clang, gnu, spdlog14,
    # demos); microarch tier envs are linux-only (the axis doesn't exist
    # on win) and INSTALL-only — pixi doesn't match archspec yet (#3281):
    # installs succeed on any runner; per C-10, tests only ever run up to
    # the runner's own capability and a skipped tier test is the
    # constraint working — never fake archspec to un-skip one. The win
    # leg is what compiles the clang-cl and mingw cells of the compiler
    # matrix.
    name: variants (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            envs: -e microarch-v0 -e microarch-v2 -e microarch-v3 -e microarch-v4 -e prod -e clang -e static -e reldbg -e spdlog14 -e gnu -e demo-static -e demo-clang
          - os: windows-latest
            envs: -e prod -e clang -e static -e reldbg -e spdlog14 -e gnu -e demo-static -e demo-clang -e demo-gnu-windows
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # setup-pixi rejects cache + run-install:false (same constraint
          # as the publish job); installs below provide no cache warm-up.
          cache: false
          locked: false
          run-install: false
      # Staleness guard intent (§8): the committed lock must not be
      # silently re-solved on the runner (a re-solve re-rolls the
      # nondeterministic tier selections). `pixi lock --check` is the
      # spec's prescribed guard but is UNRELIABLE here: on 0.76.1 it
      # exits 1 unconditionally in this workspace (fresh lock,
      # git-clean — likely a source-package staleness-digest issue;
      # upstream intent-search pending). Informational only; the REAL
      # guard is check-lock-tiers below, which asserts the lock's
      # actual tier content.
      - name: Lock staleness probe (informational — see comment)
        run: pixi --version && (pixi lock --check || true)
      - name: Install variant envs
        run: pixi install ${{ matrix.envs }}
      - name: Run the mingw demo (win-only env)
        if: runner.os == 'Windows'
        run: pixi run -e demo-gnu-windows demo
      - name: Advisory microarch check (what this runner supports)
        if: runner.os == 'Linux'
        run: pixi run check-microarch
      - name: Publish name-set assertion (C-01/C-02 compliance surface)
        if: runner.os == 'Linux'
        run: pixi exec --spec nushell nu ci/check-publish-set.nu
      - name: Lock tier-selection assertion (nondeterministic source-variant guard)
        if: runner.os == 'Linux'
        run: pixi exec --spec nushell nu ci/check-lock-tiers.nu
      - name: Spec-form assertion (wildcards only as variant placeholders)
        if: runner.os == 'Linux'
        run: pixi exec --spec nushell nu ci/check-spec-forms.nu
      - name: CI-shape assertion (locked defaults, banned flags)
        if: runner.os == 'Linux'
        run: pixi exec --spec nushell nu ci/check-ci-shape.nu
      - name: Regime-marker assertion (win ABI regimes visibly distinct in the lock)
        if: runner.os == 'Linux'
        run: pixi exec --spec nushell nu ci/check-regime-markers.nu

  publish:
    # Real publishing with OIDC trusted publishing: the channel trusts this
    # repo + workflow, so no API key is stored anywhere. See template-docs/publishing.md
    # for the channel-side setup and the local/API-key alternative.
    # Only libraries are published — the demo app is not in the publish set.
    name: publish (linux)
    needs: [consume, test, style]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC; nothing else needs write
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # No env to install (publish builds its own), so no cache either:
          # setup-pixi rejects cache + run-install: false.
          cache: false
          run-install: false
      # Two steps instead of one `pixi publish --to`: pixi (<= 0.76.1) parses
      # only the LAST path segment of the --to URL as the channel name, so a
      # user-scoped channel (prefix.dev/<user>/<channel>) uploads to the wrong
      # channel and gets a 403. `pixi upload prefix` takes the channel name
      # verbatim — same backend, same OIDC exchange, same attestation.
      # See template-docs/publishing.md (footgun #6).
      - name: Build the library packages (dependency-ordered publish set)
        run: pixi publish --to ./dist
      # --generate-attestation adds sigstore build provenance (prefix.dev):
      # consumers can verify who built the package and from which workflow.
      - name: Upload to prefix.dev (trusted publishing + attestation)
        run: |
          shopt -s globstar
          pixi upload prefix -c jackm97/naga-labs --generate-attestation --skip-existing ./dist/**/*.conda

  style:
    name: style + docs + lint (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: default dev-enginelib
      # Style tasks ride the CHEAP default env (tooling + style-tasks —
      # zero source packages; formatting never forces a build).
      - name: clang-format check
        run: pixi run format-check
      - name: Doxygen
        run: pixi run docs
      - name: clang-tidy (enginelib)
        run: pixi run -e dev-enginelib lint

  pack:
    # The non-pixi consumption path. NOTE: pixi-pack publishes source
    # packages per-package (--path semantics), which forbids source
    # run-deps — so packing envs with cross-package chains awaits an
    # upstream fix (workspace `pixi publish` handles the same set fine;
    # see the publish-local task). mathkit demonstrates the pack flow.
    name: pixi-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          locked: false
          environments: header-only
      - name: Pack the header-only library environment
        run: pixi exec pixi-pack --create-executable --environment header-only --platform ${{ runner.os == 'Windows' && 'win-64' || 'linux-64' }} pixi.toml
      - uses: actions/upload-artifact@v4
        with:
          name: packed-env-${{ matrix.os }}
          path: |
            environment.sh
            environment.ps1
          if-no-files-found: warn
