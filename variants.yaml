# variants.yaml — the workspace TOOLCHAIN PINNING FILE, referenced via
# [workspace] build-variants-files. rattler-build variant syntax (any
# name other than conda_build_config.yaml selects the rattler parser);
# platform selectors are if/then maps. This is the upstream
# (conda-forge pinning-feedstock) shape: toolchain/stdlib pins live in
# ONE reviewable artifact instead of manifest sprawl. Workspace-shaped
# axes (spdlog, microarch) stay inline in pixi.toml.
#
# Values are BARE and EXACT ("4.4" prefix-matches the series) —
# dependency SPECS elsewhere carry real bounds; variant VALUES never do.
#
# NOTE: a variant pin here enters every build's variant hash — bumping
# a toolchain pin rebuilds the world. That is the intended semantics.

# THE compiler — AdaptiveCpp, and nothing else (DELTA.md AM-1, D-04).
#
# ONE STEM, BOTH PLATFORMS. `pixi-build-cmake` implements
# `compiler('cxx')` natively as `<stem>_<target_platform>`, and the
# toolchain publishes the stem for both, so unlike main — which needed
# a per-platform selector to swap gxx for vs2026 — this branch names it
# once. A package NEVER names an activation package directly.
#
# ---- CADENCE IS A PACKAGE-VARIANT AXIS, AND THIS IS ITS BASE CELL ----
#
# The toolchain ships two lanes that are, in ACPP's own words,
# "effectively two separate toolchains": a RELEASE lane at a semver
# version (`25.10.0`, LLVM major in the BUILD STRING) and a NIGHTLY
# lane at a pure date (`2026.08.10`). They are separate PACKAGE-VARIANT
# FAMILIES, not two versions of one package, and the metadata enforces
# it both ways — `acpp` constrains `acpp-nightly <0.0a0` and
# `acpp-nightly` constrains `acpp <0.0a0`. An environment names exactly
# one cadence's stems; there is no mixing them inside one env.
#
# C-02 is what licenses separate NAMES here rather than build strings:
# `2026.x` sorts ABOVE `25.x`, so a bare spec would silently drift onto
# the nightly lane. Version ordering makes the bare spec unsafe, which
# is precisely the C-02 criterion for a named variant family.
#
# THE STEMS BELOW ARE THE RELEASE LANE, and the release lane is the
# DEFAULT — the base table is what every ordinary platform cell builds
# against. The nightly stems live in a target-scoped
# `[workspace.target.<cadence-platform>.build-variants]` table in
# pixi.toml, applied only on the named cadence platforms
# (`linux-64-nightly`, `win-64-nightly`).
#
# ⚠ THE MERGE FOOTGUN, and the reason a CI assert exists for this file:
# target build-variant tables MERGE with this base table rather than
# replacing it. A stem key that the cadence table forgets to override
# does NOT error — it silently INHERITS THE RELEASE STEM, producing a
# MIXED-LANE cell that builds green and means nothing. So the cadence
# table must swap EVERY stem key named here, and
# `ci/check-nightly-pin.nu` asserts that by COUNT EQUALITY against this
# table's stem key set, never by spot check. If you add a stem key
# here, you must add it there too, or CI will say so.
#
# Naming, because it is easy to get backwards: the cadence suffix goes
# on the BASE name, before the terminal `_<platform>` that
# `compiler('cxx')` appends — `acpp-clangxx-nightly_linux-64`, NOT
# `acpp-clangxx_linux-64-nightly`.
#
# Measured at the flip (2026-08-10, this channel, one compiled TU):
# a release cell's `hash_input.json` records
# `cxx_compiler: acpp-clangxx` and the artifact carries
# `acpp-runtime >=25.10.0,<25.11.0a0` + `acpp-llvm >=20,<21.0a0`; the
# matching nightly cell records `cxx_compiler: acpp-clangxx-nightly`
# and carries the nightly lane's EXACT run-export. So the toolchain
# really drove each compile rather than silently falling back to a host
# compiler, and the two lanes really are distinct in the artifact.
c_compiler:
  - acpp-clang
cxx_compiler:
  - acpp-clangxx
#
# NO `*_compiler_version` KEYS, DELIBERATELY — a trap, not an omission.
# The activation packages carry no version-suffixed names, so a version
# key renders a spec nothing satisfies, and it surfaces as an
# unsatisfiable build env rather than as "you set the wrong key". main
# pins gcc 16 here; do not port that shape across. `zip_keys` goes with
# them — it existed only to keep the two compiler VERSIONS in lockstep.
#
# vs2026 is NOT a compiler here. On win the acpp driver is clang-cl
# based and targets `x86_64-pc-windows-msvc`, but the activation
# packages deliberately declare no `vs20XX` dependency — verified
# against the artifacts: acpp-clangxx_win-64 -> acpp-clang_win-64 ->
# acpp, and none of the three mentions it. The MSVC headers, libs and
# SDK therefore come from the BUILD ENVIRONMENT (D-08). That is the
# whole of AM-1 on Windows: MSVC is present as a platform SDK and is
# never the thing that compiles our code.

# Redistributability floor — and on THIS branch it is LOAD-BEARING, not
# merely explicit: nothing derives a glibc floor here.
#
# pixi's automatic stdlib derivation fires only for the literal
# `conda-forge` channel, and this workspace resolves through a single
# `naga-labs` channel, so nothing DERIVES a floor from the channel.
#
# ⚠ CORRECTED 2026-08-10 — the earlier text here (and DELTA.md D-02)
# said this pair was "the ONLY thing that puts `__glibc` into a built
# package's run requirements". That is no longer true, and the
# correction is recorded rather than quietly edited because the pair is
# still load-bearing, just not for the stated reason.
#
# Re-measured with a discriminating pair (2026-08-10, pixi 0.76.1,
# release lane, one compiled TU, this channel — the two runs differ in
# NOTHING but these two keys):
#   WITHOUT the pair: depends carries `__glibc >=2.28`
#   WITH the pair:    depends carries `__glibc >=2.28`
#                     AND `__glibc >=2.28,<3.0.a0`
# The bare floor arrives on its own, from the toolchain: the compiler
# activation depends on `sysroot_linux-64 >=2.28`, whose run-export
# stamps it. What the explicit pair adds is the CEILINGED form.
#
# So the honest statement is: the pair is not what makes a floor exist,
# it is what makes the floor OURS — a floor we declare at a value we
# chose, instead of one inherited as a side effect of whatever the
# toolchain happens to depend on. Delete it and the floor silently
# becomes the toolchain's business, changing whenever ACPP bumps their
# sysroot. `ci/check-stdlib-floor.nu` reads the built artifact and
# fails if the floor is missing, because a manifest cannot prove what
# actually shipped.
#
# The VALUE is Jack's deliberate decision: 2.28, above conda-forge's
# 2.17 baseline (SYCL tooling required the bump; the same wall came up
# building OpenMDAO optimizers).
c_stdlib:
  - if: linux
    then: sysroot
c_stdlib_version:
  - if: linux
    then: "2.28"

# Build-tool pins: bind the backend's IMPLICITLY-injected tools by name
# (verified: no explicit build-dep declaration needed).
cmake:
  - "4.4"

# (The whole `m2w64_*` block — the mingw/GNU-on-Windows compiler lane
# and its stdlib keys — is DELETED on this branch, with its zip pair:
# DELTA.md D-03 and D-06. mingw and SYCL are incoherent together (every
# win acpp package requires vc14_runtime/ucrt, the toolchain is
# clang-cl-built targeting x86_64-pc-windows-msvc, and there is no
# mingw AdaptiveCpp build), so the lane cannot exist here at all. It
# remains on main, where it is the strongest argument in the template
# for pixi source wrappers. Do not restore it on a merge.)
