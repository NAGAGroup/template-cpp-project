# variants.yaml — the workspace TOOLCHAIN PINNING FILE, referenced via
# [workspace] build-variants-files. rattler-build variant syntax (any
# name other than conda_build_config.yaml selects the rattler parser);
# platform selectors are if/then maps. This is the upstream
# (conda-forge pinning-feedstock) shape: toolchain/stdlib pins live in
# ONE reviewable artifact instead of manifest sprawl. Workspace-shaped
# axes (spdlog, microarch) stay inline in pixi.toml.
#
# Values are BARE and EXACT ("4.4" prefix-matches the series) —
# dependency SPECS elsewhere carry real bounds; variant VALUES never do.
#
# NOTE: a variant pin here enters every build's variant hash — bumping
# a toolchain pin rebuilds the world. That is the intended semantics.

# Compiler pair — pinned versions kept in lockstep via zip_keys (the
# conda-forge convention; pixi supports zip_keys only through this
# file, not inline [workspace.build-variants]).
c_compiler:
  - if: linux
    then: gcc
  - if: win
    then: vs2026
cxx_compiler:
  - if: linux
    then: gxx
  - if: win
    then: vs2026
# vs2026 is the ONLY MSVC variant this template supports (GH runners
# ship it; VC 18 era). The pixi-build-cmake backend DEFAULTS to vs2022
# with a stale "more widely supported" rationale — this file is the
# explicit override; never delete it back to the default.
# Version pins preserve the tree's current toolchain (gcc 16 series —
# leading-edge doctrine), not upstream's older baseline.
c_compiler_version:
  - if: linux
    then: "16"
cxx_compiler_version:
  - if: linux
    then: "16"
zip_keys:
  - [c_compiler_version, cxx_compiler_version]
  - [m2w64_c_compiler_version, m2w64_cxx_compiler_version]

# Redistributability floor — EXPLICIT, decision not drift. glibc 2.28
# is Jack's DELIBERATE floor (SYCL tooling required the bump above
# conda-forge's 2.17 baseline; same wall hit building OpenMDAO
# optimizers). The pin lands verbatim in every published package's run
# requirements as `__glibc >=2.28`. (c_stdlib derivation is
# channel-gated — see template-docs; on non-conda-forge single-channel
# workspaces use an explicit sysroot dep + dep-name axis instead.)
c_stdlib:
  - if: linux
    then: sysroot
c_stdlib_version:
  - if: linux
    then: "2.28"

# Build-tool pins: bind the backend's IMPLICITLY-injected tools by name
# (verified: no explicit build-dep declaration needed).
cmake:
  - "4.4"

# mingw (GNU-on-Windows) compiler lane — the conda-forge m2w64 stem.
# A package opts in with `compilers = ["m2w64_cxx"]`: the backend
# renders `${{ compiler('m2w64_cxx') }}`, which resolves these keys to
# the NEW gcc_win-64/gxx_win-64 family (GCC 14; runtime DLL packages
# share linux names: libgcc/libstdcxx/ucrt run-deps arrive via the
# compiler's strong run-exports). Verified against backend source:
# arbitrary stems pass through to the compiler() jinja — only the
# variant keys below make them resolvable.
m2w64_c_compiler:
  - if: win
    then: gcc
m2w64_cxx_compiler:
  - if: win
    then: gxx
m2w64_c_compiler_version:
  - if: win
    then: "14"
m2w64_cxx_compiler_version:
  - if: win
    then: "14"

# mingw lane stdlib keys: INERT for pixi-build backends (verified in
# backend source: stdlib injection only ever consults `c_stdlib`) —
# kept for rattler-build recipe wrappers that render stdlib('m2w64_c'),
# and as the documented conda-forge shape. mingw run metadata arrives
# via the compiler run-exports instead.
m2w64_c_stdlib:
  - if: win
    then: m2w64-sysroot
m2w64_c_stdlib_version:
  - if: win
    then: "12"
