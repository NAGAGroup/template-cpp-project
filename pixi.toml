# THE workspace manifest — the ONLY [workspace] in this repository.
#
# Monorepo doctrine: one workspace owns every environment, task, and the
# build-variant matrix; member projects are PACKAGE-ONLY manifests. A
# monorepo should only contain projects that share a variant matrix —
# anything needing its own workspace belongs in its own repository.
[workspace]
channels = ["conda-forge"]
name = "template-cpp-project"
# Platform doctrine: BARE platforms for everything a normal user touches
# (bare linux-64 FIRST — every machine solves and installs it). Rich
# inline entries have exactly ONE job here: CAPABILITY GATES — pixi's own
# recommended way to declare archspec/CUDA-class constraints. Each
# microarch tier env below binds to its own gate entry; a solve uses the
# entry's DECLARED virtuals (bare entries solve with pixi's documented
# defaults — archspec=x86_64, glibc=2.28 — NOT the host's detected
# values). Platforms are never selection routers.
#
# ⚠ MICROARCH WARNING: pixi does not yet MATCH archspec at install/run
# (deliberately unimplemented: prefix-dev/pixi#3281; feature request
# #5285). A machine below a tier's level can install and run that tier
# env SILENTLY and crash later (SIGILL). Run `pixi run check-microarch`
# BEFORE using a tier env. The moment archspec matching lands upstream,
# these gates start enforcing here with zero changes.
platforms = [
  "linux-64",
  "win-64",
  { name = "linux-64-v2", platform = "linux-64", __archspec = "1=x86_64_v2" },
  { name = "linux-64-v3", platform = "linux-64", __archspec = "1=x86_64_v3" },
  { name = "linux-64-v4", platform = "linux-64", __archspec = "1=x86_64_v4" },
]
preview = ["pixi-build"]
# Fail fast on pixi versions older than the features this workspace uses.
requires-pixi = ">=0.76.1"
# Toolchain/stdlib pinning lives in ONE reviewable file (upstream
# pinning-feedstock shape; also the only route to zip_keys in pixi).
# NOTE on lock staleness: `pixi lock --check` exits stale in THIS
# workspace on 0.76.1 with or without build-variants-files (0/8 pass
# either way); MECHANISM NOT ISOLATED — minimal source-workspace
# reproductions do NOT fire, even with a live variant-axis tie, so
# neither the file nor ties nor source-workspaces-generally is the
# established cause (something template-specific; bisect pending).
# The REAL lock guard is ci/check-lock-tiers.nu, which asserts the
# committed lock's tier CONTENT. Upstream filing embargoed until a
# minimal repro exists.
build-variants-files = ["./variants.yaml"]

# ---- Dependency pool -------------------------------------------------------
# Single source of truth for every sibling path and shared spec. Package
# manifests opt in per entry with { workspace = true }; relative paths are
# re-anchored automatically for each consuming member.
[workspace.dependencies]
mathkit = { path = "packages/mathkit" }
enginelib = { path = "packages/enginelib" }
enginelib-static = { path = "packages/enginelib/variants/static" }
enginelib-relwithdebinfo = { path = "packages/enginelib/variants/relwithdebinfo" }
enginelib-asan = { path = "packages/enginelib/variants/asan" }
enginelib-tsan = { path = "packages/enginelib/variants/tsan" }
enginelib-coverage = { path = "packages/enginelib/variants/coverage" }
enginelib-clang = { path = "packages/enginelib/variants/clang" }
enginelib-mingw = { path = "packages/enginelib/variants/mingw" }
enginelib-tests = { path = "packages/enginelib/tests" }
enginelib-tests-clang = { path = "packages/enginelib/tests/variants/clang" }
enginelib-tests-mingw = { path = "packages/enginelib/tests/variants/mingw" }
enginelib-tests-asan = { path = "packages/enginelib/tests/variants/asan" }
enginelib-tests-tsan = { path = "packages/enginelib/tests/variants/tsan" }
enginelib-tests-coverage = { path = "packages/enginelib/tests/variants/coverage" }
mathkit-tests = { path = "packages/mathkit/tests" }
demo-app = { path = "packages/demo-app" }
demo-app-static = { path = "packages/demo-app/variants/static" }
demo-app-clang = { path = "packages/demo-app/variants/clang" }
demo-app-mingw = { path = "packages/demo-app/variants/mingw" }
fmt = { path = "external/fmt" }
stb = { path = "external/stb" }
catch2-mingw = { path = "external/catch2-mingw" }
spdlog-mingw = { path = "external/spdlog-mingw" }
fmt-mingw = { path = "external/fmt-mingw" }
catch2 = ">=3.5,<4"
spdlog = ">=1.15,<1.16"

# ---- Build-variant matrix --------------------------------------------------
# Two live axes, both SAME NAME / different build strings:
# - spdlog: envs select by PINNING the dep; selection works through
#   run-dep conflicts (a 1.14-built enginelib carries spdlog's <1.15
#   run-export, conflicting with a 1.15 pin). The happy path: tight
#   run-export ceilings make pins select uniquely.
# - x86_64-microarch-level: the conda-forge flag-setter as a
#   variant-substituted HOST dep (linux-only — enginelib target-scopes
#   the dep, so the key never bites on win-64). Its activation appends
#   the level's -march LAST (wins over the compiler default) and its
#   strong run-export stamps `_x86_64-microarch-level >=N` into each
#   build's run-deps — we never declare the underscore runtime gate
#   ourselves. Floors are deliberately open (a v3 CPU runs a v1 build),
#   so tier envs additionally pin the UNDERSCORE runtime package.
# One `pixi publish` builds the full matrix on the default platforms.
# Variant VALUES are bare and exact ("1.14" — prefix-matches the series,
# the conda-forge pinning-feedstock idiom); dependency SPECS elsewhere
# carry real bounds. Never ranges or wildcards as variant values.
[workspace.build-variants]
spdlog = ["1.14", "1.15"]
x86_64-microarch-level = ["1", "2", "3", "4"]

# Compiler + stdlib + build-tool pins live in ./variants.yaml (see the
# build-variants-files reference above): gcc/gxx 16 on linux, vs2026 on
# win (the ONLY supported MSVC — the backend's vs2022 default is stale),
# glibc 2.28 floor with rationale, cmake 4.4, zip_keys lockstep. The
# linux compiler AXIS remains a NAMED package variant (variants/clang) —
# compiler choice is a consumer-toolchain contract the solver cannot
# see, not a matrix it can encode.

# ---- Default environment: the LIBRARY consumer env (= the v1 tier) ---------
# The DEFAULT env is CHEAP: tooling + task features, ZERO source
# packages — formatting or docs generation must never force a source
# build. Declaring [environments.default] is valid exactly when it
# genuinely composes features (the antipattern is only a redundant
# declaration). Library consumption lives in the `prod` env below.

# Advisory microarch check (see the platforms warning above): prints the
# machine's CPU family and its highest supported x86-64 level. pixi does
# not validate archspec yet — run this BEFORE using a tier env. Rides
# the default env (the one env every machine can always install).
[target.linux-64.tasks.check-microarch]
cmd = "pixi exec --spec archspec python -c \"import archspec.cpu as m; h=m.host(); print(f'cpu: {h.name}'); print(f'max supported x86-64 level: {h.generic.name}')\""
description = "Print this machine's highest supported microarch level (advisory — pixi does not enforce archspec yet)"

# ---- Features: the unit of composition -------------------------------------
# An ENV is only a composition; its inline content is exactly its DELTA
# from shared features. DEP-features and TASK-features are separate.

# Tooling: lint/format/LSP/docs tools, defined ONCE — shared by the
# default env AND every dev env. Zero system tooling, ever.
[feature.tooling.dependencies]
clang-format = ">=22.1,<22.2"
clang-tools = ">=22.1,<22.2"
clang = ">=22.1,<22.2"
doxygen = ">=1.17,<1.18"
git = ">=2.55,<2.56"
nushell = ">=0.114,<0.115"

# Style/docs TASKS, defined once, landing wherever they compose.
[feature.style-tasks.tasks.format]
cmd = "nu scripts/format.nu"
description = "Format all C++ sources in-place (parallel)"

[feature.style-tasks.tasks.format-check]
cmd = "nu scripts/format.nu --check"
description = "Fail if any file is unformatted (CI)"

# Caching showcase: with inputs/outputs declared, pixi SKIPS the task
# when nothing changed since the last run (file-hash based) — re-run
# `pixi run docs` twice to see the cache hit.
# Style is not only formatting: material that OUTLIVES the template docs
# (manifests, CMakeLists, CI, ci/ scripts) must not point at them with a
# relative path — a generated project deletes that directory and the
# comments go dangling. Absolute upstream URL, or inline the point.
[feature.style-tasks.tasks.check-doc-refs]
cmd = "nu ci/check-doc-refs.nu"
description = "Fail on relative template-docs references in material that survives the template"

[feature.style-tasks.tasks.docs]
cmd = "doxygen Doxyfile"
inputs = ["Doxyfile", "packages/mathkit/include/**", "packages/enginelib/include/**"]
outputs = ["docs/api/**"]
description = "Generate API docs into docs/api/ (cached on inputs/outputs)"

# Cross-platform task bodies via MiniJinja and the `pixi` object — the
# {% if pixi.is_win %} conditional replaces bash/bat pairs for
# ONE-LINERS (anything longer is a nushell script, per doctrine).
[feature.style-tasks.tasks.open-docs]
cmd = "{% if pixi.is_win %}start{% else %}xdg-open{% endif %} docs/api/html/index.html"
args = []
depends-on = ["docs"]
description = "Generate (if stale) and open the API docs in a browser"

[environments.default]
features = ["tooling", "style-tasks"]

# Source-consumption surfaces, flavor-scoped and COMPLETE (mixing
# flavors — a default-variant mathkit with a static enginelib — is
# incoherent; each feature carries a coherent surface at its flavor).
[feature.header-only.dependencies]
mathkit = { workspace = true }

[feature.prod.dependencies]
enginelib = { workspace = true }
spdlog = { workspace = true }

# Flavor surfaces for the preset package variants. Each carries the
# variant package + the spdlog lineage pin (an unpinned variant-expanded
# dep would let the source-variant chooser roll either spdlog lineage).
[feature.static.dependencies]
enginelib-static = { workspace = true }
spdlog = { workspace = true }

[feature.reldbg.dependencies]
enginelib-relwithdebinfo = { workspace = true }
spdlog = { workspace = true }

[feature.clang.dependencies]
enginelib-clang = { workspace = true }
spdlog = { workspace = true }

# THE feature-target-table showcase: one feature, per-platform
# realization. "gnu" means the GNU toolchain/libstdc++ regime — on
# linux that IS the default enginelib (gcc prod); on win it is the
# mingw NAMED variant. Shared deps sit in the base table; target
# tables carry only the per-platform delta.
# spdlog is LINUX-scoped here: on linux the gnu realization is the
# channel-binary flavor (the pin keeps variant selection
# deterministic); on win the mingw lane consumes the spdlog-mingw
# source wrapper through enginelib-mingw's own closure — the channel
# spdlog would be dead weight in the env.
[feature.gnu.target.linux-64.dependencies]
enginelib = { workspace = true }
spdlog = { workspace = true }

[feature.gnu.target.win-64.dependencies]
enginelib-mingw = { workspace = true }

# Sanitizer/coverage flavors (linux-only realization; the consuming envs
# carry the platform restriction). Coverage also carries the report
# tooling its script needs — part of the flavor's coherent surface.
[feature.asan.dependencies]
enginelib-asan = { workspace = true }
spdlog = { workspace = true }

# ACTIVATION showcase: env vars set on every activation of an env
# composing this feature (pixi run / pixi shell). The right layer for
# SEMANTIC knobs that configure the flavor itself — sanitizer runtime
# options belong to the sanitizer flavor, not to individual tasks.
[feature.asan.activation.env]
ASAN_OPTIONS = "halt_on_error=1:detect_stack_use_after_return=1"
UBSAN_OPTIONS = "print_stacktrace=1:halt_on_error=1"

[feature.tsan.dependencies]
enginelib-tsan = { workspace = true }
spdlog = { workspace = true }

[feature.tsan.activation.env]
TSAN_OPTIONS = "halt_on_error=1:second_deadlock_stack=1"

[feature.coverage.dependencies]
enginelib-coverage = { workspace = true }
spdlog = { workspace = true }
llvm-tools = ">=20"
nushell = ">=0.114,<0.115"

# spdlog build-variant FLAVOR (the 1.14 branch of the matrix). This is
# deliberately a complete flavor surface, NOT a selector stacked on
# `prod`: pixi INTERSECTS dependency specs across composed features, so
# prod's `>=1.15,<1.16` + a `>=1.14,<1.15` selector is unsolvable
# (verified 0.76.1). Selectors compose only when they pin packages the
# base flavor does NOT declare (the microarch tiers); disjoint pins on
# a declared dep are a different FLAVOR.
[feature.spdlog14.dependencies]
enginelib = { workspace = true }
spdlog = ">=1.14,<1.15"

# Solve-strategy is a FEATURE concern (C-09): composing this feature
# makes an env solve its DIRECT deps lowest — the min-version
# compatibility surface. Verified 0.76.1 (incl. in source-package
# envs; governs regardless of the feature's list position). Read
# results with the SEMANTICS in mind: (a) lowest-DIRECT never lowers
# TRANSITIVE deps (catch2 arrives via the tests packages' host-deps →
# stays highest); (b) a binary dep can be FLOORED by a chosen source
# variant's run-dep (enginelib's 1.15-built variant carries
# spdlog >=1.15.3 — so test-lowest's spdlog lands exactly there, the
# lowest SATISFYING version). Min-version testing composes with
# run-export floors; it does not bypass them.
[feature.solve-lowest]
solve-strategy = "lowest-direct"

# The v1 tier pin: portable by contract — deterministically excludes
# the optimized enginelib builds with zero platform machinery.
# Linux-only (the microarch axis does not exist on win).
[feature.microarch-v1.target.linux-64.dependencies]
_x86_64-microarch-level = "==1"

# The RECOMMENDED library-consumer env (= the v1 tier).
[environments.prod]
features = ["header-only", "prod", "microarch-v1"]
no-default-feature = true

# ---- Consumer environments -------------------------------------------------
# Demo TASK, defined once; demo envs compose it and inline their app
# variant as the delta. Task-ARGUMENT showcase: optional args carry
# defaults and template into cmd via MiniJinja ({{ steps }});
# `pixi run demo 20` overrides. (Arg names cannot contain dashes.)
[feature.demo-tasks.tasks.demo]
cmd = "demo-app {{ steps }}"
args = [{ arg = "steps", default = "5" }]
description = "Run the demo application (steps = engine iterations)"

# Demo envs compose the task feature and inline their app variant as
# the delta (the app is single-use env content, not a shared surface).
# One demo env per demonstrated flavor; demo-gnu-windows is win-only
# for the same reason as test-gnu-windows.
[environments.demo]
features = ["demo-tasks"]
no-default-feature = true
dependencies = { demo-app = { workspace = true }, spdlog = { workspace = true } }

[environments.demo-static]
features = ["demo-tasks"]
no-default-feature = true
dependencies = { demo-app-static = { workspace = true }, spdlog = { workspace = true } }

[environments.demo-clang]
features = ["demo-tasks"]
no-default-feature = true
dependencies = { demo-app-clang = { workspace = true }, spdlog = { workspace = true } }

# No spdlog pin here: the mingw closure is fully in-regime source
# wrappers — nothing in this env participates in the spdlog axis.
[environments.demo-gnu-windows]
platforms = ["win-64"]
features = ["demo-tasks"]
no-default-feature = true
dependencies = { demo-app-mingw = { workspace = true } }

# Environments show capability, not just CI need: every preset variant
# has a consuming env — the template is a tutorial surface, and users
# discard what they don't need. Each consumer env = header-only + ONE
# flavor (mixing flavors is incoherent).
[environments.static]
features = ["header-only", "static"]
no-default-feature = true

[environments.reldbg]
features = ["header-only", "reldbg"]
no-default-feature = true

# Microarch TIER envs (linux-only lineage; `prod` = the v1 tier).
# Manifest composition (C-07 with teeth): the tier envs differ ONLY by
# their selector pin — everything common is the header-only + prod
# surface, and each tier feature carries ONLY its selector. An env that
# carries a selector but not the selected package silently selects
# nothing — share features across envs that share deps.
# Tier selectors pin the UNDERSCORE runtime package ==N (microarch
# levels have no minor versions — never write N.*). EVERY tier gets an
# env: environments show capability, not just CI need.
[feature.microarch-v2.dependencies]
_x86_64-microarch-level = "==2"

[feature.microarch-v3.dependencies]
_x86_64-microarch-level = "==3"

# KNOWN OPEN (upstream-shaped): in-WORKSPACE source consumption of the
# v4 tier currently resolves the level-1 build — pixi's source-variant
# chooser ties among compatible variants (the ==4 pin excludes nothing
# below it; floors are open by design). BINARY consumers of the
# published packages select correctly with this exact recipe (verified
# both ways). Tracked; do not "fix" with build-string pins.
[feature.microarch-v4.dependencies]
_x86_64-microarch-level = "==4"

# microarch-v0: nuclear-conservative fallback — NO microarch machinery
# at all. On pixi today it resolves the level-1 build anyway (the
# optimized builds' runtime floors are unsolvable on a bare platform).
# NOT recommended: any x86-64 CPU from the last ~15 years is v1+; use
# the `prod` env.
[environments.microarch-v0]
features = ["header-only", "prod"]
no-default-feature = true
platforms = ["linux-64"]

# v2/v3/v4: OPT-IN tiers. Each binds to its capability-gate platform
# entry (an env solves for EVERY platform in its list, so the binding is
# mandatory — the bare entry could not solve these). ⚠ Not enforced at
# install/run until pixi matches archspec (#3281/#5285): run
# `pixi run check-microarch` first, or a lower CPU gets SIGILL.
[environments.microarch-v2]
features = ["microarch-v2", "header-only", "prod"]
no-default-feature = true
platforms = ["linux-64-v2"]

[environments.microarch-v3]
features = ["microarch-v3", "header-only", "prod"]
no-default-feature = true
platforms = ["linux-64-v3"]

[environments.microarch-v4]
features = ["microarch-v4", "header-only", "prod"]
no-default-feature = true
platforms = ["linux-64-v4"]

# Minimal env for the pixi-pack demo — smallest packable surface. pixi-pack
# ships an environment as a self-contained archive (`--create-executable`
# yields environment.sh/.ps1) for machines with no network and no pixi.
# Packs handle envs with cross-package source chains, source run-deps
# included; this env is just the smallest demo, not a workaround. The
# feature alone IS the env.
[environments.header-only]
features = ["header-only"]
no-default-feature = true

# Compiler package-variant env: consumes the NAMED clang variant
# (variants/clang). Compiler choice is a knowingly-chosen configuration
# consumers opt into, like asan/static (C-03). ONE name, both
# platforms, platform-realized (linux: libstdc++ clang; win: clang-cl
# on the VC runtime).
[environments.clang]
features = ["header-only", "clang"]
no-default-feature = true

# GNU-regime env: same env name everywhere, per-platform realization
# via the gnu feature's target tables (gcc prod on linux, mingw on win).
[environments.gnu]
features = ["header-only", "gnu"]
no-default-feature = true

# spdlog build-variant flavor env (the 1.14 branch of the matrix — see
# the feature comment for why this is a flavor, not a prod+selector).
[environments.spdlog14]
features = ["header-only", "spdlog14"]
no-default-feature = true

# ---- Test environments -----------------------------------------------------
# Tests are CONSUMER PROJECTS; each env consumes the tests package built
# against the matching lib variant. The shared `test-tasks` feature carries
# the runner task; env-specific content is inline.
[feature.test-tasks.tasks.test]
cmd = "mathkit-tests && enginelib-tests"
description = "Run the installed test binaries of this env"

# Each test env = the matching source FLAVOR + test-tasks; the tests
# packages are the env's inline DELTA. The test matrix is deliberately
# NOT the whole variant matrix: prod + clang + sanitizers (+ gnu on
# win when the mingw lane lands) — variant consumers like `static`
# keep their consuming env without a mirrored test env.
[environments.test]
features = ["header-only", "prod", "test-tasks"]
no-default-feature = true
dependencies = { mathkit-tests = { workspace = true }, enginelib-tests = { workspace = true } }

[environments.test-clang]
features = ["header-only", "clang", "test-tasks"]
no-default-feature = true
dependencies = { enginelib-tests-clang = { workspace = true } }
[environments.test-clang.tasks.test]
cmd = "enginelib-tests"

# THE env-platform-limiting showcase: this env exists ONLY on win-64.
# gnu-on-linux is gcc prod — already tested by `test`; a cross-platform
# test-gnu would test gcc twice.
[environments.test-gnu-windows]
platforms = ["win-64"]
features = ["header-only", "gnu", "test-tasks"]
no-default-feature = true
dependencies = { enginelib-tests-mingw = { workspace = true } }
[environments.test-gnu-windows.tasks.test]
cmd = "enginelib-tests"

[environments.test-asan]
platforms = ["linux-64"]
features = ["header-only", "asan", "test-tasks"]
no-default-feature = true
dependencies = { enginelib-tests-asan = { workspace = true } }
[environments.test-asan.tasks.test]
cmd = "enginelib-tests"

[environments.test-tsan]
platforms = ["linux-64"]
features = ["header-only", "tsan", "test-tasks"]
no-default-feature = true
dependencies = { enginelib-tests-tsan = { workspace = true } }
[environments.test-tsan.tasks.test]
cmd = "enginelib-tests"

[environments.test-coverage]
platforms = ["linux-64"]
features = ["header-only", "coverage", "test-tasks"]
no-default-feature = true
dependencies = { enginelib-tests-coverage = { workspace = true } }
# Task-level `env` showcase: a manual `test` in this env would litter
# the cwd with default.profraw — the task-scoped variable redirects the
# profile without touching the env's activation (task env > activation
# env, for exactly this task).
[environments.test-coverage.tasks.test]
cmd = "enginelib-tests"
env = { LLVM_PROFILE_FILE = "coverage/manual-run.profraw" }
# Task RESOLUTION: `coverage` lives in exactly ONE env, so a bare
# `pixi run coverage` resolves here without -e. Contrast `test`, which
# exists in every test env and MUST be disambiguated with -e (or run
# via the env-pinned test-all fan-out).
[environments.test-coverage.tasks.coverage]
cmd = "nu scripts/coverage.nu"
description = "Run instrumented tests; lcov report + structured per-file coverage table"

# Min-version compatibility check: the SAME surface as `test`, plus the
# solve-lowest strategy feature (C-09) — direct deps resolve to their
# lowest SATISFYING versions (see the feature comment for how
# run-export floors and directness shape the result).
[environments.test-lowest]
features = ["solve-lowest", "header-only", "prod", "test-tasks"]
no-default-feature = true
dependencies = { mathkit-tests = { workspace = true }, enginelib-tests = { workspace = true } }

# ---- Dev environments (strictly per-package) -------------------------------
# A package's dev env = its dependency closure WITHOUT building it, plus
# dev-only tools. Per-package because a combined env would BUILD sibling
# packages. Day-to-day work is plain CMake presets inside the env; tasks
# carry the package cwd.
# Dev features: the package AND its tests package as DEV packages —
# their closures deliver catch2 and everything the tests build needs
# (no direct catch2 spec anywhere). Tools come from `tooling` via env
# composition, defined once instead of per-dev-feature.
[feature.dev-mathkit.dev]
mathkit = { path = "packages/mathkit" }
mathkit-tests = { path = "packages/mathkit/tests" }

[feature.dev-mathkit.tasks.configure]
cmd = "nu scripts/configure-dev.nu packages/mathkit"
description = "Configure mathkit's in-tree dev build"

[feature.dev-mathkit.tasks.dev-test]
cmd = "nu scripts/dev-test.nu packages/mathkit"
description = "Dev loop: cmake-install mathkit into the dev env, then build+run tests against it"

[feature.dev-mathkit.tasks.lint]
cmd = "cd tests && cmake --preset dev && run-clang-tidy -quiet -p build/dev"
cwd = "packages/mathkit"
description = "clang-tidy over mathkit's tests tree (header-only: headers lint through consumers)"

[environments.dev-mathkit]
features = ["dev-mathkit", "tooling"]
no-default-feature = true

[feature.dev-enginelib.dev]
enginelib = { path = "packages/enginelib" }
enginelib-tests = { path = "packages/enginelib/tests" }

[feature.dev-enginelib.dependencies]
# Pin the variant-expanded dep to the default lineage: an unpinned
# variant dep in a dev closure makes --locked verification unstable.
spdlog = { workspace = true }

[feature.dev-enginelib.tasks.configure]
cmd = "nu scripts/configure-dev.nu packages/enginelib"
description = "Configure enginelib's in-tree dev build"

[feature.dev-enginelib.tasks.build]
cmd = "cmake --build build/dev"
cwd = "packages/enginelib"
depends-on = ["configure"]
description = "Build enginelib's in-tree dev tree"

[feature.dev-enginelib.tasks.dev-test]
cmd = "nu scripts/dev-test.nu packages/enginelib"
description = "Dev loop: cmake-install enginelib into the dev env, then build+run tests against it"

# Args-with-CHOICES showcase: constrained values get validated by pixi
# ("choose from: check, fix") and drive a jinja conditional in cmd.
[feature.dev-enginelib.tasks.lint]
cmd = "run-clang-tidy {% if mode == 'fix' %}-fix {% endif %}-quiet -p build/dev"
args = [{ arg = "mode", default = "check", choices = ["check", "fix"] }]
cwd = "packages/enginelib"
depends-on = ["configure"]
description = "clang-tidy static analysis over enginelib's dev build (mode = check|fix)"

[environments.dev-enginelib]
features = ["dev-enginelib", "tooling"]
no-default-feature = true

[feature.dev-demo-app.dev]
demo-app = { path = "packages/demo-app" }

[feature.dev-demo-app.tasks.configure]
cmd = "nu scripts/configure-dev.nu packages/demo-app"
description = "Configure demo-app's in-tree dev build"

[environments.dev-demo-app]
features = ["dev-demo-app", "tooling"]
no-default-feature = true

# (The old `style` env is deleted: it was a dependency set wearing an
# environment costume — its deps are the `tooling` feature, its tasks
# the `style-tasks` feature, and both ride the default env.)

# ---- Workspace-level tasks --------------------------------------------------
[tasks.publish-local]
cmd = "pixi publish --to {{ channel }}"
args = [{ arg = "channel", default = "./local-channel" }]
description = "Build + publish every opted-in package (full variant matrix) into an indexed local channel"

# Fan out across the test envs; each dependency is pinned to ITS env
# (the env-pinned depends-on showcase). Per-platform target tables
# carry each platform's real test surface (C-10: tests are
# runner-bounded — the win list adds the win-only gnu env, the linux
# list adds the sanitizers).
[tasks.test-all]
depends-on = [
  { task = "test", environment = "test" },
]
description = "Run all cross-platform test envs"

[target.linux-64.tasks.test-all]
depends-on = [
  { task = "test", environment = "test" },
  { task = "test", environment = "test-clang" },
  { task = "test", environment = "test-asan" },
  { task = "test", environment = "test-tsan" },
]
description = "Run all test envs (incl. clang + sanitizers)"

[target.win-64.tasks.test-all]
depends-on = [
  { task = "test", environment = "test" },
  { task = "test", environment = "test-clang" },
  { task = "test", environment = "test-gnu-windows" },
]
description = "Run all test envs (incl. clang-cl + mingw)"
