# mathkit: header-only library, standalone-consumable.
# This root manifest is BOTH the workspace (dev/test envs, tasks) AND the
# default package + version anchor. External consumers:
#   mathkit = { git = "<this repo>", tag = "mathkit-v0.1.0", subdirectory = "packages/mathkit" }
[workspace]
channels = ["conda-forge"]
name = "mathkit"
platforms = ["linux-64", "win-64"]
preview = ["pixi-build"]

# Implicit default env = consumer env (self-consumes the package).
[dependencies]
mathkit = { path = "." }

[package]
name = "mathkit"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.config]
extra-args = ["--preset=default"]
# Header-only: no TU includes these headers during the package's own
# build, so without this glob header edits would NOT invalidate pixi's
# build cache.
extra-input-globs = ["include/**/*.hpp"]

# NOTE(run-exports): pixi >=0.74 supports [package.run-exports] so a
# library can weak-export itself (consumers host-dep it and receive it as
# a run dep automatically). As of pixi 0.76.1 a path-resolution bug makes
# any run-exports table break sibling path deps when a member workspace is
# used directly (upstream issue pending), so this template uses explicit
# [package.run-dependencies] in consumers instead. See docs/consuming.md.

# ---- Test environment ------------------------------------------------------
# Tests are a CONSUMER PROJECT (tests/); the test env consumes the tests
# package (mathkit arrives transitively as its host dep).
[feature.test.dependencies]
mathkit-tests = { path = "tests" }

[environments.test]
features = ["test"]
no-default-feature = true

[feature.test.tasks.test]
cmd = "mathkit-tests"
description = "Run the installed test binary (use with -e test)"

# ---- Dev environment -------------------------------------------------------
# The package's dependency closure WITHOUT building it, plus dev-only
# tools (zero-system-tooling tenet: Catch2 for the dev test loop).
[feature.dev.dev]
mathkit = { path = "." }

[feature.dev.dependencies]
catch2 = ">=3.5,<4"

[feature.dev.tasks.configure]
cmd = "cmake --preset dev"
description = "Configure the in-tree dev build"

[feature.dev.tasks.dev-test]
cmd = """
cmake --preset dev \
&& cmake --build build/dev \
&& cmake --install build/dev --prefix "$CONDA_PREFIX" \
&& cd tests \
&& cmake --preset dev \
&& cmake --build build/dev \
&& ctest --test-dir build/dev --output-on-failure"""
description = "Dev-loop testing: cmake-install mathkit into the dev env, then build+run tests against it (no packages involved)"

[environments.dev]
features = ["dev"]
no-default-feature = true
