# enginelib: compiled library, THE variant teacher. PACKAGE-ONLY manifest
# (the DEFAULT variant: Release, shared) — the single workspace at the
# repo root owns all environments, tasks, and the variant matrix. The
# preset-variant subpackages live under variants/.
# External consumers:
#   enginelib = { git = "<this repo>", tag = "enginelib-v0.1.0", subdirectory = "packages/enginelib" }
[package]
name = "enginelib"
version = "0.1.0"
publish = true

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.config]
extra-args = ["--preset=default"]

[package.host-dependencies]
# Sibling source dep (public: appears in our headers) — spec inherited
# from the root [workspace.dependencies] pool and re-anchored.
mathkit = { workspace = true }
# Boring happy path: a plain conda-forge BINARY dep. On main this is
# `"*"` because spdlog carries a build-variant axis; here it is an
# ordinary pinned spec, since that axis is not inherited (D-23).
spdlog = { workspace = true }
# Escape-hatch wrapper dep (rattler-build; see external/stb).
stb = { workspace = true }

# Microarch axis (linux-only, hence target-scoped: the conda-forge
# flag-setter is unix-only noarch). The "*" is variant-substituted per
# [workspace.build-variants] → one enginelib build per level, same name.
# HOST placement is load-bearing: the flag-setter's STRONG run-export
# stamps `_x86_64-microarch-level >=N` into run-deps only — from
# build-deps it would also contaminate this package's own host solve and
# bind BUILDING to the build machine (conda-forge's own build wall).
# Its activation appends the level's -march last; we never hand-edit
# CXXFLAGS and never declare the underscore runtime gate ourselves.
[package.target.linux-64.host-dependencies]
x86_64-microarch-level = "*"

# THE RUN-DEPENDENCIES RULE, modern form: mathkit appears in our PUBLIC
# headers, so consumers' compilers need it too — and it reaches them
# automatically because mathkit WEAK-EXPORTS ITSELF (see mathkit's
# [package.run-exports]): host-depending on it is enough. stb is
# private+header-only but our CMake config always resolves it (static
# consumers link it via the export set), so it stays a manual run-dep.
# spdlog's runtime lib reaches consumers via the conda-forge package's
# own run-exports.
[package.run-dependencies]
stb = { workspace = true }

# Shared library: weak-export ourselves so consumers that host-depend on
# enginelib automatically receive it (and, transitively, mathkit) at run
# time. Version-specced because self-exports publish unversioned otherwise.
[package.run-exports.weak]
enginelib = ">=0.1.0,<0.2"
