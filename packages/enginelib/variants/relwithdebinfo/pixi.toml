# enginelib-relwithdebinfo: preset-variant subpackage (package-only manifest; version
# kept in sync with the default package — see docs/versioning.md).
[package]
name = "enginelib-relwithdebinfo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=relwithdebinfo"]

[package.host-dependencies]
mathkit = { workspace = true }
spdlog = "*"
stb = { workspace = true }

[package.run-dependencies]
mathkit = { workspace = true }
stb = { workspace = true }

[package.run-exports.weak]
enginelib-relwithdebinfo = "0.1.*"
