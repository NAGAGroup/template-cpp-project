# enginelib-v3: x86-64-v3 microarchitecture performance variant
# (linux-only: conda-forge's microarch metapackages are unix-only noarch).
# The pinned metapackage sets -march via its activation script during the
# hermetic build — never hand-edit CXXFLAGS — and its run-export
# (_x86_64-microarch-level >=3) makes __archspec refuse installation
# on older CPUs. Explicit per-level subpackages because microarch
# run-export semantics (correctly) never conflict and run-deps aren't
# variant-substituted (pixi#4303) — see docs/build-variants.md.
[package]
name = "enginelib-v3"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=default"]

[package.host-dependencies]
mathkit = { workspace = true }
spdlog = "*"
stb = { workspace = true }
x86_64-microarch-level = "3.*"

[package.run-dependencies]
mathkit = { workspace = true }
stb = { workspace = true }
x86_64-microarch-level = "3.*"

[package.run-exports.weak]
enginelib-v3 = "0.1.*"
