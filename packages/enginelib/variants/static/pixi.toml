# enginelib-static: preset-variant subpackage (package-only manifest; version
# kept in sync with the default
# package — see https://github.com/NAGAGroup/template-cpp-project/blob/main/template-docs/versioning.md).
[package]
name = "enginelib-static"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=static"]

[package.host-dependencies]
mathkit = { workspace = true }
spdlog = { workspace = true }
stb = { workspace = true }

[package.run-dependencies]
mathkit = { workspace = true }
stb = { workspace = true }

[package.run-exports.weak]
enginelib-static = ">=0.1.0,<0.2"

# WINDOWS SDK — D-08, and the one Windows-specific line in this package.
# The acpp driver is clang-cl based and targets x86_64-pc-windows-msvc,
# but the activation packages deliberately declare NO `vs20XX`
# dependency (verified against the artifacts: acpp-clangxx_win-64 ->
# acpp-clang_win-64 -> acpp, none of them mentions it). So the MSVC
# headers, libs and SDK have to come from the build environment, or
# lld-link fails on `kernel32.lib`. This is a BUILD dependency and
# never a compiler variant — MSVC is present here as a platform SDK and
# is not the thing that compiles our code (AM-1).
[package.target.win-64.build-dependencies]
vs2026_win-64 = ">=19.51,<20"

# THE ARCHIVER — linux, and only the static flavor needs it.
#
# AdaptiveCpp's activation exports the conda-forge toolchain names
# (`AR=x86_64-conda-linux-gnu-ar`, and ranlib alongside it) but the
# toolchain does not SHIP those binaries. Shared libraries are
# unaffected because they are produced through the compiler driver;
# a static archive calls `ar` directly and dies with exit 127,
# `x86_64-conda-linux-gnu-ar: not found`. Verified: an installed acpp
# env contains no archiver at all.
#
# `binutils_linux-64` provides the prefixed names and coexists with the
# toolchain (checked — acpp constrains clang/clangxx/llvm, not
# binutils). An archiver is a legitimate BUILD TOOL to declare, so this
# is not a package reaching into its dependency's business; it is this
# package saying which tools its build needs.
#
# Reported to ACPP as the third toolchain gap. If the activation stops
# exporting names it does not provide, or the toolchain starts shipping
# them, delete this. See DELTA.md D-28.
[package.target.linux-64.build-dependencies]
binutils_linux-64 = ">=2.44,<3"
