# enginelib-clang: NAMED compiler package variant (package-only manifest;
# version kept in sync with the default
# package — see https://github.com/NAGAGroup/template-cpp-project/blob/main/template-docs/versioning.md).
# ONE name, BOTH platforms, platform-realized. The name is grounded two
# ways: compiler choice is a knowingly-chosen configuration (C-03, like
# asan/static) AND cross-compiler object mixing is not guaranteed
# ABI-safe even on a shared runtime — on win, clang-cl shares MSVC's VC
# runtime, which NARROWS the regime gap but does not close it (shared
# VC runtime ≠ safe object mixing). This replaces the deleted linux-64-clang
# custom-platform routing: platforms are capability gates, never
# selection routers. Bring-your-own-compiler mechanics: disable backend
# compiler provisioning, declare the toolchain per platform.
[package]
name = "enginelib-clang"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
path = "../.."

# --preset=clang carries the REGIME GUARD (expect CMAKE_CXX_COMPILER_ID
# = Clang): if the intended toolchain ever silently loses the configure
# (an env-exported -D outranking preset cacheVariables is the classic
# path), the build fails loudly instead of shipping MSVC/gcc under the
# clang name. The win target inherits the guard via clang-win.
[package.build.config]
extra-args = ["--preset=clang"]
compilers = []

# Windows realization: keep the vs2026 ACTIVATION (VC env, headers,
# libs) and add plain `clang`; the clang-win preset selects clang-cl as
# the compiler driver. The conda-forge clang_win-64 activation stems are
# NOT usable here: they exact-pin vs2019/vs2022 and fail a vs2026-only
# toolset. The backend passes -GNinja explicitly on the cmake command
# line (verified in backend source), so the activation's VS-generator
# env var cannot collide. Configure detail lives in the PRESET, never in
# extra-args (rule 2).
[package.build.target.win-64.config]
extra-args = ["--preset=clang-win"]

[package.target.linux-64.build-dependencies]
clangxx_linux-64 = ">=22.1,<22.2"

[package.target.win-64.build-dependencies]
vs2026_win-64 = ">=19.51,<20"
clang = ">=22.1,<22.2"

[package.host-dependencies]
mathkit = { workspace = true }
spdlog = "*"
stb = { workspace = true }

[package.run-dependencies]
mathkit = { workspace = true }
stb = { workspace = true }

[package.run-exports.weak]
enginelib-clang = ">=0.1.0,<0.2"
