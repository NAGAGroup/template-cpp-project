# enginelib-mingw: NAMED compiler package variant — GNU toolchain ON
# WINDOWS (libstdc++ regime, vs the default MSVC/VC-runtime regime).
# This name is FULLY regime-grade (clang's is configuration-grade plus
# a narrowed-but-open regime gap): a mingw-built lib is NOT
# link-compatible with MSVC consumers —
# exactly C-02's "compatibility contract extends to the consumer's own
# toolchain". WIN-ONLY package: it is only ever referenced from
# win-64 target tables and win-only envs (gnu-on-linux is just gcc =
# the default `enginelib`) — the workspace's way of limiting a package
# to one platform.
# Toolchain via the conda-forge m2w64 compiler stem: `compilers =
# ["m2w64_cxx"]` renders `${{ compiler('m2w64_cxx') }}`, resolved by
# the m2w64_cxx_compiler keys in variants.yaml to gxx_win-64 (GCC 14
# family). Runtime metadata (libgcc/libstdcxx/ucrt) arrives via the
# compiler's strong run-exports — never declared by hand.
[package]
name = "enginelib-mingw"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=default"]
compilers = ["m2w64_cxx"]

# REGIME CLOSURE: every native-code dep is in-regime — spdlog comes
# from the spdlog-mingw SOURCE wrapper, not the channel's MSVC build.
# The channel package contaminates through its EXPORTED CMAKE
# INTERFACE (an unconditional /Zc:__cplusplus in the config's
# INTERFACE_COMPILE_OPTIONS — even on the header-only target), so no
# consumption mode of the MSVC artifact escapes; an in-regime source
# package is the actual fix. mathkit/stb are header-only and
# regime-neutral. Note the spdlog build-variant axis deliberately does
# NOT reach this lane (the wrapper pins one lineage) — the axis
# belongs to the channel-binary happy path.
[package.host-dependencies]
mathkit = { workspace = true }
spdlog-mingw = { workspace = true }
stb = { workspace = true }

# No manual spdlog run-dep needed: spdlog-mingw weak-exports itself
# (recipe requirements/run_exports), so host-depending on it delivers
# its config to OUR consumers' build envs — the same modern form the
# channel spdlog and our own libraries use.
[package.run-dependencies]
mathkit = { workspace = true }
stb = { workspace = true }

[package.run-exports.weak]
enginelib-mingw = ">=0.1.0,<0.2"
