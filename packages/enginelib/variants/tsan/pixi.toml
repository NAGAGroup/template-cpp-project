# enginelib-tsan: preset-variant subpackage (package-only manifest; version
# kept in sync with the root package — see docs/versioning.md).
# External consumers:
#   enginelib-tsan = { git = "<this repo>", tag = "enginelib-v0.1.0", subdirectory = "packages/enginelib/variants/tsan" }
[package]
name = "enginelib-tsan"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=tsan"]

[package.host-dependencies]
mathkit = { path = "../../../mathkit" }
spdlog = "*"

[package.run-dependencies]
mathkit = { path = "../../../mathkit" }
