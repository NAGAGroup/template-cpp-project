# enginelib-coverage: llvm-cov instrumented variant. Doubles as the
# BRING-YOUR-OWN-COMPILER teaching case: llvm source-based coverage needs
# clang, so this variant disables the backend's default compiler
# provisioning and declares its own toolchain
# (https://github.com/NAGAGroup/template-cpp-project/blob/main/template-docs/toolchains.md).
[package]
name = "enginelib-coverage"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=coverage"]
compilers = []

[package.build-dependencies]
clangxx_linux-64 = ">=22.1,<22.2"
compiler-rt = ">=22.1,<22.2"

[package.host-dependencies]
mathkit = { workspace = true }
spdlog = { workspace = true }
stb = { workspace = true }

[package.run-dependencies]
mathkit = { workspace = true }
stb = { workspace = true }

[package.run-exports.weak]
enginelib-coverage = ">=0.1.0,<0.2"

# WINDOWS SDK — D-08, and the one Windows-specific line in this package.
# The acpp driver is clang-cl based and targets x86_64-pc-windows-msvc,
# but the activation packages deliberately declare NO `vs20XX`
# dependency (verified against the artifacts: acpp-clangxx_win-64 ->
# acpp-clang_win-64 -> acpp, none of them mentions it). So the MSVC
# headers, libs and SDK have to come from the build environment, or
# lld-link fails on `kernel32.lib`. This is a BUILD dependency and
# never a compiler variant — MSVC is present here as a platform SDK and
# is not the thing that compiles our code (AM-1).
[package.target.win-64.build-dependencies]
vs2026_win-64 = ">=19.51,<20"
