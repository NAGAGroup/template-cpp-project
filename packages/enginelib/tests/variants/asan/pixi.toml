# enginelib-tests-asan: tests built against (and like) enginelib-asan.
[package]
name = "enginelib-tests-asan"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=asan"]

[package.host-dependencies]
enginelib-asan = { workspace = true }
catch2 = { workspace = true }

