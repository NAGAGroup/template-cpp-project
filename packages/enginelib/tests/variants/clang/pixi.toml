# enginelib-tests-clang: tests built WITH clang against enginelib-clang —
# the whole flavor surface is clang, not just the library (mixing
# compilers within a flavor env would be incoherent). Same
# bring-your-own-compiler mechanics as the lib variant (variants/clang):
# disable backend compiler provisioning, declare the toolchain directly.
[package]
name = "enginelib-tests-clang"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=default"]
compilers = []

# Windows realization mirrors the lib variant: vs2026 activation +
# plain clang + the clang-win preset (clang-cl). See variants/clang.
[package.build.target.win-64.config]
extra-args = ["--preset=clang-win"]

[package.target.linux-64.build-dependencies]
clangxx_linux-64 = ">=22.1,<22.2"

[package.target.win-64.build-dependencies]
vs2026_win-64 = ">=19.51,<20"
clang = ">=22.1,<22.2"

[package.host-dependencies]
enginelib-clang = { workspace = true }
catch2 = { workspace = true }
