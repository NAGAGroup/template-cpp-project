# enginelib-tests-mingw: tests built WITH the mingw toolchain against
# enginelib-mingw (coherent GNU-on-Windows flavor — libstdc++ regime
# end-to-end). Win-only, like the lib variant it tests. Toolchain via
# the m2w64 compiler stem; see variants/mingw for the mechanics.
[package]
name = "enginelib-tests-mingw"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
path = "../.."

[package.build.config]
extra-args = ["--preset=default"]
compilers = ["m2w64_cxx"]

# catch2-mingw, NOT the channel catch2: Catch2 is a COMPILED library
# with no header-only escape, so the mingw regime needs an in-regime
# rebuild (see external/catch2-mingw). CMake still finds it as Catch2.
[package.host-dependencies]
enginelib-mingw = { workspace = true }
catch2-mingw = { workspace = true }
