# enginelib-tests: consumer project for enginelib's DEFAULT variant.
# Package-only manifest, internal-only (consumed by the root test envs).
[package]
name = "enginelib-tests"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.config]
extra-args = ["--preset=default"]

[package.host-dependencies]
enginelib = { workspace = true }
catch2 = { workspace = true }

