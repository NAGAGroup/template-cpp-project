# demo-app-mingw: the demo application built WITH the mingw toolchain
# against enginelib-mingw (GNU-on-Windows flavor end-to-end). Win-only;
# see packages/enginelib/variants/mingw for the m2w64 stem mechanics.
[package]
name = "demo-app-mingw"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
path = "../.."

# --preset=mingw consumes fmt header-only (ABI-regime closure — see
# packages/enginelib/variants/mingw).
[package.build.config]
extra-args = ["--preset=mingw"]
compilers = ["m2w64_cxx"]

[package.host-dependencies]
enginelib-mingw = { workspace = true }
fmt = { workspace = true }
