# demo-app: application, internal-only package-only manifest. Lives in
# the root workspace's `demo` environment (its portable-enginelib run-dep
# cannot share an env with the microarch-optimized enginelib builds);
# flavor variants under variants/ ride the demo-* envs.
[package]
name = "demo-app"
version = "0.1.0"
# NOT published: a channel is for libraries other projects consume, not for
# demo applications. (Omitting `publish = true` keeps it out of the set that
# `pixi publish` walks.)

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.config]
extra-args = ["--preset=default"]

[package.host-dependencies]
enginelib = { workspace = true }
# Wrapper source dep (pixi-build-cmake; see external/fmt). fmt IS on
# conda-forge — wrapped for teaching. A source dep named `fmt` overrides
# the channel binary for every resolver in this workspace.
fmt = { workspace = true }

# No manual run-deps needed: enginelib and fmt weak-export themselves,
# so host-depending on them delivers them (and mathkit transitively) at
# run time — THE RUN-DEPENDENCIES RULE, modern form.

# WINDOWS SDK — D-08, and the one Windows-specific line in this package.
# The acpp driver is clang-cl based and targets x86_64-pc-windows-msvc,
# but the activation packages deliberately declare NO `vs20XX`
# dependency (verified against the artifacts: acpp-clangxx_win-64 ->
# acpp-clang_win-64 -> acpp, none of them mentions it). So the MSVC
# headers, libs and SDK have to come from the build environment, or
# lld-link fails on `kernel32.lib`. This is a BUILD dependency and
# never a compiler variant — MSVC is present here as a platform SDK and
# is not the thing that compiles our code (AM-1).
[package.target.win-64.build-dependencies]
vs2026_win-64 = ">=19.51,<20"
