package:
  name: spdlog-mingw
  version: "1.15.3"

source:
  # Release tarball, not git (see ../catch2-mingw: pixi's all-refs git
  # fetch can hard-fail on Windows' case-insensitive filesystem; the
  # tag tree is case-clean, verified).
  - url: https://github.com/gabime/spdlog/archive/refs/tags/v1.15.3.tar.gz
    sha256: 15a04e69c222eb6c01094b5c7ff8a249b36bb22788d72519646fb85feb267e67

build:
  # win-only (the mingw regime only exists there). Static lib with the
  # BUNDLED fmt (SPDLOG_FMT_EXTERNAL=OFF): self-contained — no fmt dep
  # to keep in-regime for the library lane.
  script:
    - if: win
      then:
        - cmake -GNinja -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% -DSPDLOG_BUILD_EXAMPLE=OFF -DSPDLOG_BUILD_TESTS=OFF && cmake --build build --target install

requirements:
  build:
    - gxx_win-64 >=14,<15
    - cmake
    - ninja
  # Weak self-export — THE RUN-DEPENDENCIES RULE, modern form (rule 6),
  # same as the channel spdlog: consumers of enginelib-mingw need
  # spdlog's CMake config at THEIR build time (enginelibConfig does an
  # unconditional find_dependency(spdlog) — the static variant genuinely
  # links it), and a host dep's run-export is how it gets there.
  run_exports:
    weak:
      - spdlog-mingw >=1.15.3,<1.16
