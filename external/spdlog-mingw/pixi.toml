# WRAPPER PACKAGE: spdlog, rebuilt from upstream IN THE MINGW ABI REGIME
# (rattler-build escape hatch, release-tarball source — see
# ../catch2-mingw for both rationales).
#
# THE decisive lesson (verified against the actual conda-forge artifact,
# spdlog win-64 spdlogConfigTargets.cmake): a foreign-regime package
# contaminates consumers through its EXPORTED CMAKE INTERFACE, not
# merely its binaries — the config bakes an UNCONDITIONAL
# `/Zc:__cplusplus` into INTERFACE_COMPILE_OPTIONS (right next to a
# properly generator-expression-guarded `/utf-8`), and even the
# spdlog::spdlog_header_only target carries it, so header-only
# consumption does NOT escape the regime. Importing the config is
# already the contamination. In-regime pixi SOURCE packages are what
# actually solve it: this wrapper's own build exports a GNU-regime
# config.
[package]
name = "spdlog-mingw"
version = "1.15.3"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "==0.4.5" }
