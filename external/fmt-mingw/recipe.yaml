package:
  name: fmt-mingw
  version: "11.2.0"

source:
  - url: https://github.com/fmtlib/fmt/archive/refs/tags/11.2.0.tar.gz
    sha256: bc23066d87ab3168f27cef3e97d545fa63314f5c79df5ea444d41d56f962c6af

build:
  # win-only (the mingw regime only exists there); static lib.
  script:
    - if: win
      then:
        - cmake -GNinja -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% -DFMT_TEST=OFF -DFMT_DOC=OFF && cmake --build build --target install

# No run_exports (not surfaced by pixi's source bridge — see
# ../spdlog-mingw); demo-app-mingw host-depends on this directly.
requirements:
  build:
    - gxx_win-64 >=14,<15
    - cmake
    - ninja
