# WRAPPER PACKAGE: Catch2, rebuilt from upstream IN THE MINGW ABI REGIME
# via the pixi-build-rattler-build ESCAPE HATCH.
#
# This package does DOUBLE duty. First, it is the capability showcase:
# targeting mingw on Windows is traditionally a no-go (no binary deps
# exist in-regime; you'd end up in find_package-then-FetchContent
# CMake surgery) — with pixi source packages it's this one ~25-line
# wrapper, consumed by name, ZERO CMake changes to the packages that
# use it. Second, it demonstrates the constraint that makes the
# capability necessary:
#
# The regime-closure lesson: conda-forge's catch2 is
# MSVC-built on win-64 — a compiled static library whose symbols are
# MSVC-mangled. A mingw (GNU/libstdc++) test binary cannot link it, and
# unlike spdlog/fmt, Catch2 v3 has no header-only mode to escape into.
# So the mingw test lane rebuilds Catch2 in-regime. The `-mingw` suffix
# is the same ABI-regime naming the enginelib-mingw variant carries —
# it never shadows the channel's catch2, and only the mingw tests
# consume it. (Header-only deps escape the regime problem; compiled
# deps must be rebuilt — that is the whole rule.)
#
# Why rattler-build and not the cmake backend: pixi git sources fetch
# ALL refs, and the Catch2 repository carries case-conflicting refs in
# its history — the fetch hard-fails on Windows' case-insensitive
# filesystem (exactly where this package must build). recipe.yaml
# takes a release TARBALL (url + sha256), which the v3.15.3 tree
# extracts cleanly everywhere. A second reason the escape hatch earns
# its name.
[package]
name = "catch2-mingw"
version = "3.15.3"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "==0.4.5" }
