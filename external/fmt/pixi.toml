# WRAPPER PACKAGE: fmt, built from upstream source with pixi-build-cmake.
#
# The escape-hatch decision tree for external dependencies
# (https://github.com/NAGAGroup/template-cpp-project/blob/main/template-docs/external-deps.md):
#   1. conda-forge has a binary  -> use it            (spdlog in enginelib)
#   2. upstream has sane CMake   -> THIS wrapper      (pixi-build-cmake)
#   3. upstream CMake is broken  -> rattler-build     (../stb)
#   4. FetchContent/CPM          -> NEVER
#
# (fmt IS on conda-forge — it is wrapped here for teaching. The pin is
# UPSTREAM's tag; tag-then-re-pin flow: bump the tag, `pixi update`.)
#
# PUBLISHED, deliberately, name collision with conda-forge and all:
# wrappers are first-class publishable artifacts. On a layered channel
# with overlay-first priority our fmt is PREFERRED for channel
# consumers — and that is coherent closure, not contamination: a
# consumer of our enginelib receives the fmt it was built against.
# Channel priority is a PREFERENCE, not strict exclusion (a spec above
# our version falls through to upstream and resolves), and any
# consumer can override the channel for one dependency in their own
# manifest — nobody is trapped. See
# https://github.com/NAGAGroup/template-cpp-project/blob/main/template-docs/publishing.md
# footgun 1 for the full semantics.
#
# NOTE: upstream projects have no CMakePresets, so wrappers are the one
# place where raw -D flags in extra-args are correct.
[package]
name = "fmt"
version = "11.2.0"
publish = true

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.4.5" }

[package.build.source]
git = "https://github.com/fmtlib/fmt"
tag = "11.2.0"

[package.build.config]
extra-args = ["-DFMT_TEST=OFF", "-DFMT_DOC=OFF"]

# Weak self-export: consumers that host-depend on fmt get it at run time.
[package.run-exports.weak]
fmt = ">=11.2,<11.3"
