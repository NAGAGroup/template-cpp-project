package:
  name: stb
  version: "2026.8.6"

source:
  git: https://github.com/nothings/stb
  rev: 2c980bb59875b0d32144a71867fbdebb2f77cd20

build:
  script:
    - mkdir -p "$PREFIX/include/stb" "$PREFIX/lib/cmake/stb"
    - cp *.h "$PREFIX/include/stb/"
    - |
      cat > "$PREFIX/lib/cmake/stb/stbConfig.cmake" <<'EOF'
      # Hand-written CMake config for stb (upstream ships no build system).
      if(TARGET stb::stb)
        return()
      endif()
      get_filename_component(_stb_prefix "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)
      add_library(stb::stb INTERFACE IMPORTED)
      set_target_properties(stb::stb PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "${_stb_prefix}/include")
      unset(_stb_prefix)
      EOF
